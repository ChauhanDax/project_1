<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="index.html"><button type="button">Home</button></a><br>

  

  <form action="homepage.html" method="get">
    <fieldset>
      <legend><h4>sign up</h4></legend>
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="enter your valid name" required><br><br>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="enter valid email " required><br><br>
    </div>
    <div>
      <label for="NUMBER">Phone Number</label>
      <input type="tel" id="num" placeholder="enter your valid number"  required><br><br>
    </div>

    <div>
      <label for="pwd">Set Password:</label>
      <input type="password" id="pwd" name="pwd"placeholder="set your password" required><br><br>
    </div>

    <div>
      <input type="submit" value="Submit">
    </div>
    </fieldset>
  </form>
</body>

</html>
